html, body { overscroll-behavior: none; -webkit-overflow-scrolling: touch; }

.stage, canvas, .frame { -webkit-user-select: none; user-select: none; touch-action: manipulation; }

/* Install banner */
#installBar {
  display: none;
  position: fixed;
  left: 12px; right: 12px; bottom: calc(12px + env(safe-area-inset-bottom, 0px));
  z-index: 20;
  background: var(--glass);
  -webkit-backdrop-filter: blur(28px) saturate(180%);
  backdrop-filter: blur(28px) saturate(180%);
  border: 1px solid var(--edge);
  border-radius: 18px;
  padding: 12px 14px;
  align-items: center;
  gap: 12px;
  box-shadow: 0 12px 40px rgba(0,0,0,.35);
}
#installBar.show { display: flex; }
#installBar img { width: 44px; height: 44px; border-radius: 12px; }
#installBar .txt { flex: 1; min-width: 0; }
#installBar .txt strong { display: block; font-size: 15px; font-weight: 600; }
#installBar .txt span { font-size: 12px; color: var(--dim); }
#installBar button {
  border: 0; border-radius: 12px; min-height: 36px; padding: 0 14px;
  font: 600 14px inherit; background: var(--tint); color: #fff; cursor: pointer;
}
#installBar .x {
  background: transparent; color: var(--dim); font-size: 20px; padding: 0 6px; min-height: auto;
}

/* Subtle first-load splash */
#splash {
  position: fixed; inset: 0; z-index: 30;
  background: #000; display: flex; flex-direction: column;
  align-items: center; justify-content: center; gap: 18px;
  transition: opacity .45s ease, visibility .45s;
}
#splash.hide { opacity: 0; visibility: hidden; pointer-events: none; }
#splash .logo {
  width: 88px; height: 88px; border-radius: 22px;
  background: radial-gradient(circle at 40% 35%, #5AC8FA, #0A84FF 55%, #003d7a);
  box-shadow: 0 0 0 1px rgba(255,255,255,.08), 0 20px 50px rgba(10,132,255,.35);
}
#splash h2 {
  margin: 0; font: 700 22px/1.1 Orbitron, system-ui, sans-serif;
  letter-spacing: .18em; color: #F5F5F7;
}

// Hide splash once first frame is ready
requestAnimationFrame(() => {
  setTimeout(() => {
    const s = document.getElementById('splash');
    if (s) s.classList.add('hide');
  }, 550);
});

// Light haptic feedback where supported
const haptic = (ms = 8) => {
  try { if (navigator.vibrate) navigator.vibrate(ms); } catch (_) {}
};

// Wire haptic to primary actions
document.addEventListener('click', (e) => {
  const b = e.target.closest('button, .chip, .btn');
  if (b) haptic(6);
}, { passive: true });

// Service Worker
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./sw.js').catch(() => {});
  });
}

// Install prompt logic
let deferredPrompt = null;
const bar = document.getElementById('installBar');
const installBtn = document.getElementById('installBtn');
const installX = document.getElementById('installX');

function showInstallBar() {
  if (isStandalone || sessionStorage.getItem('aurelix-install-dismissed')) return;
  if (bar) bar.classList.add('show');
}

window.addEventListener('beforeinstallprompt', (e) => {
  e.preventDefault();
  deferredPrompt = e;
  showInstallBar();
});

// iOS: show gentle tip if not installed
const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
if (isIOS && !isStandalone) {
  // Delay so it doesn't fight the splash
  setTimeout(showInstallBar, 1800);
}

if (installBtn) {
  installBtn.addEventListener('click', async () => {
    haptic(12);
    if (deferredPrompt) {
      deferredPrompt.prompt();
      const { outcome } = await deferredPrompt.userChoice;
      deferredPrompt = null;
      if (bar) bar.classList.remove('show');
    } else if (isIOS) {
      // iOS has no programmatic install — guide the user
      alert('To install:\n1. Tap the Share button\n2. Scroll and choose “Add to Home Screen”');
    }
  });
}

if (installX) {
  installX.addEventListener('click', () => {
    if (bar) bar.classList.remove('show');
    sessionStorage.setItem('aurelix-install-dismissed', '1');
  });
}

// Keep theme-color in sync with system
const updateThemeColor = () => {
  const dark = window.matchMedia('(prefers-color-scheme: dark)').matches;
  document.querySelectorAll('meta[name="theme-color"]').forEach(m => {
    if (m.media && m.media.includes('dark') && !dark) return;
    if (m.media && m.media.includes('light') && dark) return;
  });
};
window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', updateThemeColor);
</script>
</body>
